[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ransomware-investigator"
version = "0.1.0"
description = "Local, unprivileged ransomware evidence inventory and case management"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ri = "ransomware_investigator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
